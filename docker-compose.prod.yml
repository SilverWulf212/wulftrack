services:
  web:
    image: wulftrack-web:local
    container_name: plane-web
    restart: always
    depends_on:
      - api

  admin:
    image: wulftrack-admin:local
    container_name: plane-admin
    restart: always
    depends_on:
      - api
      - web

  space:
    image: wulftrack-space:local
    container_name: plane-space
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/spaces/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      - api
      - web

  api:
    image: makeplane/plane-backend:stable
    container_name: plane-api
    restart: always
    command: ./bin/docker-entrypoint-api.sh
    env_file:
      - ./apps/api/.env
    depends_on:
      - plane-db
      - plane-redis

  worker:
    image: makeplane/plane-backend:stable
    container_name: plane-bgworker
    restart: always
    command: ./bin/docker-entrypoint-worker.sh
    env_file:
      - ./apps/api/.env
    depends_on:
      - api
      - plane-db
      - plane-redis

  beat-worker:
    image: makeplane/plane-backend:stable
    container_name: plane-beatworker
    restart: always
    command: ./bin/docker-entrypoint-beat.sh
    env_file:
      - ./apps/api/.env
    depends_on:
      - api
      - plane-db
      - plane-redis

  migrator:
    image: makeplane/plane-backend:stable
    container_name: plane-migrator
    restart: "no"
    command: ./bin/docker-entrypoint-migrator.sh
    env_file:
      - ./apps/api/.env
    depends_on:
      - plane-db
      - plane-redis

  live:
    image: makeplane/plane-live:stable
    container_name: plane-live
    restart: always
    env_file:
      - ./apps/live/.env

  plane-db:
    image: postgres:18-alpine
    container_name: plane-db
    restart: always
    command: postgres -c 'max_connections=1000'
    volumes:
      - pgdata18:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata

  plane-redis:
    image: valkey/valkey:8-alpine
    container_name: plane-redis
    restart: always
    volumes:
      - redisdata:/data

  plane-mq:
    image: rabbitmq:4.1-management-alpine
    container_name: plane-mq
    restart: always
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  plane-minio:
    image: minio/minio
    container_name: plane-minio
    restart: always
    command: server /export --console-address ":9090"
    volumes:
      - uploads:/export
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}

  proxy:
    image: makeplane/plane-proxy:stable
    container_name: plane-proxy
    restart: always
    ports:
      - "0.0.0.0:8484:80"
    env_file:
      - .env
    environment:
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
      BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
    depends_on:
      - web
      - api
      - space
      - admin
    networks:
      - default
      - proxy

volumes:
  pgdata:
  pgdata18:
  redisdata:
  uploads:
  rabbitmq_data:

networks:
  proxy:
    external: true
